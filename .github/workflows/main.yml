name: Build Windows EXE

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --noconfirm --clean --windowed --name G-Labs-Flow-Video --collect-all PySide6 desktop/main.py

      - name: Upload EXE
        uses: actions/upload-artifact@v4
        with:
          name: G-Labs-Flow-Video-Windows
          path: dist/G-Labs-Flow-Video.exe
